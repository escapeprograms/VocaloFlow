# ============================================================================
# Conda environment: rvc
# RVC voice-conversion baseline (RVCBaseline/ wrapper around Applio).
#
#   conda env create -f RVCBaseline/environment.yml
#   conda activate rvc
#
# Python 3.12 | PyTorch 2.7.1 + CUDA 12.8 (cu128 wheels via the PyTorch index below).
# Versions are exact pins captured from the working environment.
# ============================================================================
name: rvc
