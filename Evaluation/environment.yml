# ============================================================================
# Conda environment: vocaloflow-eval
# Evaluation pipeline (Evaluation/run_eval.py and friends).
#
#   conda env create -f Evaluation/environment.yml
#   conda activate vocaloflow-eval
#
# Python 3.11 | PyTorch 2.5.1 + CUDA 12.1 (cu121 wheels via the PyTorch index below).
# Eval-only packages vs the base vocaloflow env: openai-whisper (WER), jiwer +
# RapidFuzz (WER scoring), speechmos (MOS), tiktoken (whisper dep), torchvision.
# NOTE: UTMOS and ContentVec/HuBERT are fetched at runtime via torch.hub and are
# intentionally NOT pinned here.
# Versions are exact pins captured from the working environment.
# ============================================================================
name: vocaloflow-eval
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.15
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - audioread==3.1.0
    - certifi==2026.4.22
