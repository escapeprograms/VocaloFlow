# ============================================================================
# Conda environment: vocaloflow-datasynthesizer
# DataSynthesizer orchestration env (also used by Evaluation step 2,
# generate_dali_ustx.py). The GPU-heavy SoulX-Singer work runs in a separate
# `soulxsinger` subprocess env via config.SOULX_PYTHON.
#
#   conda env create -f DataSynthesizer/environment.yml
#   conda activate vocaloflow-datasynthesizer
#
# Python 3.10 | CPU-only torch 2.10.0 (default PyPI build, no CUDA).
# NOTE: this env now includes a CPU build of torch (+ transformers) used by
# DataSynthesizer/utils/vocoders.py for mel<->audio. Earlier docs called this
# env "torch-free"; that is no longer accurate.
# Versions are exact pins captured from the working environment.
# ============================================================================
name: vocaloflow-datasynthesizer
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.20
  - pip
  - pip:
    - annotated-doc==0.0.4
