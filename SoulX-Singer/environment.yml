# ============================================================================
# Conda environment: soulxsinger
# SoulX-Singer inference + RMVPE note extraction. Run as a subprocess by the
# DataSynthesizer pipeline via config.SOULX_PYTHON; not activated directly.
#
#   conda env create -f SoulX-Singer/environment.yml
#   conda activate soulxsinger
#
# Python 3.10 | PyTorch 2.2.0 + CUDA 11.8 (cu118 wheels via the PyTorch index below).
# This file is the AUTHORITATIVE, reproducible spec for our environment.
# SoulX-Singer/requirements.txt is the VENDORED UPSTREAM list and is left untouched.
# Load-bearing overrides vs upstream (see DataSynthesizer/SETUP.md):
#   - transformers==4.42.4 / tokenizers==0.19.1  (>=4.53 breaks SoulX LlamaAttention.forward)
#   - torch / torchaudio built for cu118
# Versions are exact pins captured from the working environment.
# ============================================================================
name: soulxsinger
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.20
  - pip
  - pip:
