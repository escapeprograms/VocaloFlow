# ============================================================================
# Conda environment: vocaloflow
# VocaloFlow training & inference (the main thesis model).
# Also used by: AdversarialFinetune, AdversarialPostnet, PL-BERT, SpeakerEmbedding.
#
#   conda env create -f VocaloFlow/environment.yml
#   conda activate vocaloflow
#
# Python 3.11 | PyTorch 2.5.1 + CUDA 12.1 (cu121 wheels via the PyTorch index below).
# Versions are exact pins captured from the working environment. To rebuild for a
# different CUDA version, change the --extra-index-url and the torch / torchaudio
# version tags together.
# ============================================================================
name: vocaloflow
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.15
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu121
